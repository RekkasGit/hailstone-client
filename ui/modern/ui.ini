# A user interface for Hailstone: every folder of ui/ with a ui.ini is one, chosen in Options > Display >
# Interface (hailstone.ini ui.name = the folder's name).
name=Modern
description=A clean, modern interface: unit frames, action bars, buff tracker, compass and minimap in translucent panels, and every game window redone as a resizable, searchable dialog.
# The input the UI is built for: mouse, gamepad or touch (comma-separated).
input=mouse
# game_art = icons: of the game's UI files only the item, spell and gem icons are used (no window art);
# all: every file of uifiles/default.
game_art=icons
